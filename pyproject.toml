[project]
name = "oraduck-bench"
version = "0.1.0"
description = "Benchmark harness and end-to-end tests for the OraDuck extension"
requires-python = ">=3.12"
dependencies = ["oracledb>=3", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
oraduck-bench = "oraduck_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench/oraduck_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/e2e"]
